<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mini Quiz — Test</title>
<style>
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.125em;fill:currentColor;flex-shrink:0;}
</style>
<style>
/* ═══════════════════════════════════════════
TOKENS
═══════════════════════════════════════════ */
:root {
--primary:#4f46e5; --primary-light:#e0e7ff; --primary-dark:#3730a3;
--secondary:#10b981; --secondary-light:#d1fae5;
--danger:#ef4444; --danger-light:#fee2e2;
--warning:#f59e0b; --warning-light:#fef3c7;
--exam:#8b5cf6; --exam-light:#ede9fe;
--written:#06b6d4; --written-light:#cffafe;
--gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
--gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
--gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937;
--radius:0.75rem;
--shadow:0 2px 8px rgba(0,0,0,.09);
--shadow-lg:0 8px 24px rgba(0,0,0,.13);
--sidebar-w:280px;
--header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
body{background:var(--gray-50);color:var(--gray-800);height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
/* ═══════════════════════════════════════════
APP SHELL
═══════════════════════════════════════════ */
.app{display:flex;flex:1;overflow:hidden;position:relative;}
/* ═══════════════════════════════════════════
HEADER
═══════════════════════════════════════════ */
.topbar{
height:var(--header-h);background:var(--card-bg,white);border-bottom:1px solid var(--gray-200);
display:flex;align-items:center;padding:0 1rem;gap:.75rem;flex-shrink:0;
position:relative;z-index:200;
}
.topbar-menu{
width:36px;height:36px;border-radius:8px;border:none;background:none;
display:flex;align-items:center;justify-content:center;
cursor:pointer;color:var(--gray-600);font-size:1rem;flex-shrink:0;
transition:background .15s;
}
.topbar-menu:hover{background:var(--gray-100);}
.topbar-title{font-size:1.05rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
/* ═══════════════════════════════════════════
SIDEBAR
═══════════════════════════════════════════ */
.sidebar{
width:var(--sidebar-w);flex-shrink:0;
background:var(--card-bg,white);border-right:1px solid var(--gray-200);
display:flex;flex-direction:column;
overflow:hidden;
transition:transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s;
z-index:150;
}
/* Mobile: offcanvas */
@media(max-width:768px){
.sidebar{
position:fixed;top:0;left:0;height:100%;
transform:translateX(-100%);
box-shadow:none;
}
.sidebar.open{
transform:translateX(0);
box-shadow:4px 0 24px rgba(0,0,0,.18);
}
}
/* Desktop: always visible */
@media(min-width:769px){
.sidebar{transform:none !important;}
.sidebar-overlay{display:none !important;}
}
.sidebar-overlay{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.3);z-index:140;
}
.sidebar-overlay.show{display:block;}
/* Sidebar header */
.sidebar-header{
height:var(--header-h);display:flex;align-items:center;
padding:0 1rem;gap:.6rem;flex-shrink:0;
border-bottom:1px solid var(--gray-100);
}
.sidebar-logo{
width:32px;height:32px;border-radius:8px;background:var(--primary-light);
display:flex;align-items:center;justify-content:center;
color:var(--primary);font-size:.85rem;flex-shrink:0;
}
.sidebar-quiz-title{
font-weight:700;font-size:.95rem;flex:1;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-close{
width:28px;height:28px;border-radius:6px;border:none;background:none;
cursor:pointer;color:var(--gray-400);font-size:.85rem;
display:none;align-items:center;justify-content:center;
transition:background .15s;
}
@media(max-width:768px){.sidebar-close{display:flex;}}
.sidebar-close:hover{background:var(--gray-100);color:var(--gray-700);}
/* Sidebar nav sections */
.sidebar-nav{flex-shrink:0;padding:.5rem 0;}
.snav-item{
display:flex;align-items:center;gap:.65rem;
padding:.65rem 1.1rem;cursor:pointer;
font-size:.88rem;font-weight:600;color:var(--gray-600);
border-left:3px solid transparent;
transition:all .15s;
}
.snav-item:hover{background:var(--gray-50);color:var(--gray-800);}
.snav-item.active{background:var(--primary-light);color:var(--primary-dark);border-left-color:var(--primary);}
.snav-item i{width:18px;text-align:center;font-size:.9rem;flex-shrink:0;}
.snav-badge{
margin-left:auto;background:var(--primary);color:white;
font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:999px;
}
.snav-divider{height:1px;background:var(--gray-100);margin:.35rem .75rem;}
/* Sidebar sections list */
.sidebar-sections{flex:1;overflow-y:auto;padding:.25rem 0 .5rem;}
.sidebar-sections::-webkit-scrollbar{width:4px;}
.sidebar-sections::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:2px;}
/* Folder in sidebar */
.sf-folder{margin-bottom:2px;}
.sf-folder-hd{
display:flex;align-items:center;gap:.5rem;
padding:.55rem .9rem .55rem 1rem;cursor:pointer;
font-size:.82rem;font-weight:700;color:var(--gray-600);
transition:background .1s;user-select:none;
}
.sf-folder-hd:hover{background:var(--gray-50);}
.sf-folder-hd .fi{font-size:.88rem;flex-shrink:0;}
.sf-folder-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-folder-stat{font-size:.68rem;color:var(--gray-400);white-space:nowrap;}
.sf-folder-chev{font-size:.65rem;color:var(--gray-400);flex-shrink:0;transition:transform .2s;}
.sf-folder-hd.collapsed .sf-folder-chev{transform:rotate(-90deg);}
.sf-children{padding:0;}
.sf-children.hidden{display:none;}
/* Subfolder */
.sf-subfolder-hd{
display:flex;align-items:center;gap:.5rem;
padding:.45rem .9rem .45rem 2rem;cursor:pointer;
font-size:.78rem;font-weight:600;color:var(--gray-500);
background:var(--gray-50);
transition:background .1s;
}
.sf-subfolder-hd:hover{background:var(--gray-100);}
/* Section row in sidebar */
.sf-sec{
display:flex;align-items:center;gap:.5rem;
padding:.5rem .9rem .5rem 1.1rem;cursor:pointer;
font-size:.82rem;color:var(--gray-700);
border-left:2px solid transparent;
transition:all .12s;position:relative;
}
.sf-sec.ind1{padding-left:1.75rem;}
.sf-sec.ind2{padding-left:2.4rem;}
.sf-sec:hover{background:var(--primary-light);color:var(--primary-dark);}
.sf-sec.active-sec{background:var(--primary-light);color:var(--primary-dark);border-left-color:var(--primary);font-weight:600;}
.sf-sec-icon{
width:24px;height:24px;border-radius:6px;
background:var(--gray-100);color:var(--gray-500);
display:flex;align-items:center;justify-content:center;
font-size:.7rem;flex-shrink:0;
}
.sf-sec.active-sec .sf-sec-icon{background:var(--primary);color:white;}
.sf-sec-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-sec-pct{font-size:.65rem;color:var(--gray-400);white-space:nowrap;flex-shrink:0;}
.sf-sec.active-sec .sf-sec-pct{color:var(--primary);}
.sf-sec-done{
width:16px;height:16px;border-radius:50%;
background:var(--secondary);color:white;
display:flex;align-items:center;justify-content:center;
font-size:.55rem;flex-shrink:0;
}
.ungrouped-lbl{
font-size:.65rem;font-weight:700;color:var(--gray-400);
text-transform:uppercase;letter-spacing:.07em;
padding:.6rem 1.1rem .25rem;
}
/* Sidebar bottom */
.sidebar-bottom{
flex-shrink:0;border-top:1px solid var(--gray-100);
padding:.5rem .75rem;display:flex;gap:.4rem;
}
.sbot-btn{
flex:1;padding:.45rem;border-radius:var(--radius);border:1px solid var(--gray-200);
background:none;cursor:pointer;font-size:.72rem;font-weight:600;color:var(--gray-500);
display:flex;flex-direction:column;align-items:center;gap:.2rem;
transition:all .15s;
}
.sbot-btn:hover{background:var(--gray-50);border-color:var(--gray-300);color:var(--gray-700);}
.sbot-btn i{font-size:.85rem;}
.sbot-btn.exam-btn:hover{background:var(--exam-light);border-color:var(--exam);color:var(--exam);}
.sbot-btn.review-btn:hover{background:#ede9fe;border-color:#7c3aed;color:#7c3aed;}
/* ═══════════════════════════════════════════
MAIN CONTENT
═══════════════════════════════════════════ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.content-area{flex:1;overflow-y:auto;padding:1.25rem;padding-bottom:max(4rem,calc(1.25rem + env(safe-area-inset-bottom)));}
@media(max-width:600px){.content-area{padding:1rem;padding-bottom:max(4rem,calc(1rem + env(safe-area-inset-bottom)));}}
.container{max-width:760px;margin:0 auto;}
.screen{display:none;flex:1;overflow:hidden;flex-direction:column;}
.screen.active{display:flex;}
/* ═══════════════════════════════════════════
SECTION SUBHEADER (in normal mode)
═══════════════════════════════════════════ */
.sec-subheader{
background:var(--card-bg,white);border-bottom:1px solid var(--gray-200);
padding:.5rem 1.25rem .4rem;flex-shrink:0;
}
.sec-prog-row{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--gray-500);margin-bottom:.3rem;}
.sec-prog-bar-wrap{height:6px;background:var(--gray-100);border-radius:999px;overflow:hidden;}
.sec-prog-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--secondary),var(--primary));transition:width .4s;}
/* ═══════════════════════════════════════════
LIBRARY (home screen)
═══════════════════════════════════════════ */
.lib-hero{
background:var(--card-bg,white);border-radius:var(--radius);padding:1.25rem 1.5rem;
box-shadow:var(--shadow);border:1px solid var(--gray-200);margin-bottom:1rem;
}
.lib-hero h2{font-size:1.25rem;font-weight:800;margin-bottom:.2rem;}
.lib-hero p{font-size:.82rem;color:var(--gray-500);}
.lib-desc{
background:var(--primary-light);border-left:3px solid var(--primary);
border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem;
font-size:.88rem;color:var(--primary-dark);line-height:1.55;
}
.lib-start-btn{
display:flex;align-items:center;gap:.6rem;justify-content:center;
margin-top:.85rem;padding:.65rem;border-radius:var(--radius);
background:var(--primary);color:white;border:none;cursor:pointer;
font-size:.9rem;font-weight:700;width:100%;transition:background .15s;
}
.lib-start-btn:hover{background:var(--primary-dark);}
/* Folder group in library (main content) */
.folder-group{background:var(--card-bg,white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gray-200);margin-bottom:.75rem;overflow:hidden;}
.folder-hd{
display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;cursor:pointer;
border-bottom:1px solid var(--gray-100);user-select:none;transition:background .1s;
}
.folder-hd:active{background:var(--gray-50);}
.folder-hd-name{flex:1;font-weight:700;font-size:.95rem;color:var(--gray-700);}
.folder-hd-stat{font-size:.72rem;color:var(--gray-400);white-space:nowrap;}
.folder-hd-chev{color:var(--gray-400);font-size:.72rem;transition:transform .2s;flex-shrink:0;}
.folder-hd.collapsed .folder-hd-chev{transform:rotate(-90deg);}
.folder-children.collapsed{display:none;}
.subfolder-hd{
display:flex;align-items:center;gap:.5rem;
padding:.6rem 1.25rem .6rem 2rem;cursor:pointer;
background:var(--gray-50);border-bottom:1px solid var(--gray-100);
user-select:none;
}
.subfolder-name{flex:1;font-weight:600;font-size:.88rem;color:var(--gray-600);}
.subfolder-chev{color:var(--gray-400);font-size:.65rem;transition:transform .2s;}
.subfolder-hd.collapsed .subfolder-chev{transform:rotate(-90deg);}
/* Section row inside library cards */
.sec-row{
display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;
border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;
}
.sec-row:last-child{border-bottom:none;}
.sec-row:active{background:var(--primary-light);}
.sec-row.ind1{padding-left:1.75rem;}
.sec-row.ind2{padding-left:2.5rem;}
.sec-row-icon{
width:36px;height:36px;border-radius:10px;
background:var(--primary-light);color:var(--primary);
display:flex;align-items:center;justify-content:center;
font-size:.85rem;flex-shrink:0;
}
.sec-row-body{flex:1;min-width:0;}
.sec-row-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sec-row-desc{font-size:.74rem;color:var(--gray-500);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sec-row-prog{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;}
.sec-row-prog-bar{flex:1;height:5px;background:var(--gray-200);border-radius:3px;overflow:hidden;}
.sec-row-prog-fill{height:100%;background:linear-gradient(90deg,var(--secondary),var(--primary));border-radius:3px;transition:width .3s;}
.sec-row-prog-txt{font-size:.68rem;color:var(--gray-400);white-space:nowrap;}
.sec-row-arrow{color:var(--gray-300);font-size:.75rem;flex-shrink:0;}
.ungrouped-label{font-size:.72rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;padding:.75rem 0 .25rem;}
.folder-reset-btn{
padding:.2rem .55rem;border-radius:6px;border:1px solid var(--danger);
color:var(--danger);background:var(--card-bg,white);font-size:.68rem;font-weight:600;
cursor:pointer;flex-shrink:0;transition:all .15s;
}
.folder-reset-btn:hover{background:var(--danger-light);}
/* ═══════════════════════════════════════════
CARDS
═══════════════════════════════════════════ */
.card{
background:var(--card-bg,white);border-radius:var(--radius);padding:1.35rem;
margin-bottom:1.1rem;box-shadow:var(--shadow);
border:1px solid var(--gray-200);border-left-width:4px;
border-left-color:var(--gray-200);
}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;border-bottom:1px solid var(--gray-100);padding-bottom:.85rem;}
.badge{display:inline-block;padding:.22rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--gray-200);color:var(--gray-700);}
.badge-mcq{background:var(--primary-light);color:var(--primary-dark);}
.badge-tf{background:var(--warning-light);color:#b45309;}
.badge-written{background:var(--written-light);color:#0e7490;}
.badge-mcq-multi{background:#f0fdf4;color:#166534;border:1.5px solid #86efac;}
.badge-ordering{background:#fff7ed;color:#c2410c;border:1.5px solid #fdba74;}
.badge-matching{background:#f3e8ff;color:#6d28d9;}
.q-num{font-size:.75rem;font-weight:600;color:var(--gray-400);margin-left:.25rem;}
.q-text{font-size:.97rem;line-height:1.58;margin-bottom:.85rem;white-space:pre-wrap;}
/* ═══════════════════════════════════════════
OPTIONS
═══════════════════════════════════════════ */
.options-grid{display:flex;flex-direction:column;gap:.55rem;}
.option-item{display:flex;align-items:center;padding:.85rem 1rem;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:.18s;background:var(--card-bg,white);gap:.7rem;}
.option-item:hover{background:var(--gray-50);border-color:var(--gray-300);}
.option-item.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:500;}
.option-item.correct{background:var(--secondary-light);border-color:var(--secondary);color:#047857;}
.option-item.incorrect{background:var(--danger-light);border-color:var(--danger);color:#b91c1c;}
.option-item-missed{background:#fffbeb;border-color:#f59e0b;color:#92400e;}
[data-theme="dark"] .option-item.selected{background:#312e81 !important;border-color:#818cf8 !important;color:#e0e7ff !important;font-weight:600;}
[data-theme="dark"] .option-item-missed{background:#451a03 !important;border-color:#c2410c !important;color:#fcd34d !important;}
[data-theme="dark"] .option-item-missed *{color:#fcd34d !important;}
.option-item.disabled{opacity:.65;cursor:not-allowed;pointer-events:none;}
.option-letter{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;flex-shrink:0;background:var(--gray-100);color:var(--gray-600);transition:all .18s;}
.option-item.selected .option-letter{background:var(--primary);color:white;}
.option-item.correct .option-letter{background:var(--secondary);color:white;}
.option-item.incorrect .option-letter{background:var(--danger);color:white;}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;}
/* ═══════════════════════════════════════════
FEEDBACK
═══════════════════════════════════════════ */
.feedback{margin-top:1.1rem;padding:.9rem 1rem;border-radius:var(--radius);display:none;}
.feedback.show{display:block;}
.feedback-correct{background:var(--secondary-light);border-left:4px solid var(--secondary);}
.feedback-incorrect{background:var(--danger-light);border-left:4px solid var(--danger);}
.feedback strong{display:block;margin-bottom:.15rem;}
.feedback .explanation{font-size:.88rem;color:var(--gray-600);margin-top:.3rem;line-height:1.5;white-space:pre-wrap;}
/* ═══════════════════════════════════════════
WRITTEN
═══════════════════════════════════════════ */
.written-answer-box{margin-top:.9rem;padding:.9rem;background:var(--gray-50);border-radius:var(--radius);}
.written-answer-box textarea{width:100%;padding:.7rem;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:.95rem;resize:vertical;min-height:90px;font-family:inherit;}
.written-answer-box textarea:focus{outline:none;border-color:var(--primary);}
.written-answer-box textarea:disabled{background:var(--gray-100);cursor:not-allowed;}
.written-saved{background:var(--card-bg,white);padding:.7rem;border:1px solid var(--gray-200);border-radius:var(--radius);white-space:pre-wrap;line-height:1.6;font-size:.92rem;}
/* ═══════════════════════════════════════════
MATCHING
═══════════════════════════════════════════ */
.matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.5rem;}
.match-item{padding:.55rem .65rem;border-radius:var(--radius);border:1.5px solid var(--gray-200);cursor:pointer;font-size:.85rem;transition:all .15s;background:var(--card-bg,white);min-height:42px;display:flex;align-items:center;line-height:1.3;}
.match-item:hover{border-color:var(--gray-300);background:var(--gray-50);}
.match-item.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}
.match-item.matched{border-color:var(--secondary);background:var(--secondary-light);}
.match-item.match-correct{border-color:var(--secondary);background:var(--secondary-light);color:#047857;}
.match-item.match-wrong{border-color:var(--danger);background:var(--danger-light);color:#b91c1c;}
.match-item.disabled{pointer-events:none;}
/* ═══════════════════════════════════════════
ORDERING
═══════════════════════════════════════════ */
.ordering-list{display:flex;flex-direction:column;gap:.4rem;}
.ordering-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;background:var(--card-bg,white);border:1.5px solid var(--gray-200);border-radius:var(--radius);user-select:none;-webkit-user-select:none;touch-action:none;transition:background .15s,border-color .15s;}
.ordering-item.ordering-correct{border-color:var(--secondary);background:var(--secondary-light);}
.ordering-item.ordering-wrong{border-color:var(--danger);background:var(--danger-light);}
.ordering-item.dm-dragging{opacity:.35;}
.ordering-item.dm-drop-before{box-shadow:0 -3px 0 0 var(--primary) !important;}
.ordering-item.dm-drop-after{box-shadow:0 3px 0 0 var(--primary) !important;}
.ordering-handle{color:var(--gray-400);font-size:.85rem;flex-shrink:0;cursor:grab;touch-action:none;}
.ordering-handle:active{cursor:grabbing;}
.ordering-pos-badge{font-size:.72rem;font-weight:700;color:var(--gray-500);background:var(--gray-100);border-radius:999px;padding:1px 7px;flex-shrink:0;min-width:24px;text-align:center;}
.dm-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.75;border-radius:var(--radius);background:var(--card-bg,white);box-shadow:0 6px 24px rgba(0,0,0,.22);transition:none;}
/* ═══════════════════════════════════════════
BUTTONS
═══════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 1rem;border-radius:var(--radius);font-weight:600;cursor:pointer;border:none;transition:.18s;font-size:.88rem;}
.btn-primary{background:var(--primary);color:white;} .btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:var(--secondary);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-outline{background:var(--card-bg,white);border:1px solid var(--gray-300);color:var(--gray-700);} .btn-outline:hover{background:var(--gray-50);}
.btn-exam{background:var(--exam);color:white;} .btn-exam:hover{opacity:.9;}
.btn-sm{padding:.35rem .75rem;font-size:.82rem;}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--gray-500);padding:.25rem;border-radius:4px;font-size:.95rem;}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-800);}
.bookmark-btn{background:none;border:none;color:var(--gray-400);cursor:pointer;padding:.25rem;font-size:1rem;transition:color .15s;}
.bookmark-btn.active{color:var(--warning);}
/* ═══════════════════════════════════════════
EXAM SETUP
═══════════════════════════════════════════ */
.modal-section{margin-bottom:1.4rem;}
.modal-label{display:block;font-weight:700;color:var(--gray-700);margin-bottom:.55rem;font-size:.88rem;}
.checkbox-group{display:flex;flex-direction:column;gap:.35rem;}
.checkbox-row{display:flex;align-items:center;gap:.75rem;padding:.6rem .85rem;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:.15s;background:var(--card-bg,white);}
.checkbox-row:hover{border-color:var(--primary);background:var(--primary-light);}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;}
.checkbox-row-label{font-size:.88rem;font-weight:500;flex:1;}
.checkbox-row-count{font-size:.72rem;color:var(--gray-400);}
.feedback-toggle{display:flex;gap:.5rem;flex-wrap:wrap;}
.feedback-toggle label{flex:1;min-width:130px;display:flex;align-items:center;gap:.5rem;padding:.6rem .85rem;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:.15s;font-size:.85rem;font-weight:500;}
.feedback-toggle label:hover{border-color:var(--primary);background:var(--primary-light);}
.feedback-toggle input[type=radio]{accent-color:var(--primary);}
.shuffle-toggle{display:flex;align-items:center;gap:.75rem;padding:.6rem .85rem;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;background:var(--card-bg,white);}
.shuffle-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
.timer-input-row{display:flex;align-items:center;gap:.5rem;}
.timer-input-row input{width:70px;padding:.4rem .5rem;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:.92rem;text-align:center;font-family:inherit;}
.timer-input-row input:focus{outline:none;border-color:var(--primary);}
/* Exam screen sub-header */
.exam-header-sub{background:var(--gray-50);border-bottom:1px solid var(--gray-200);padding:.45rem 1.25rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0;}
.exam-prog-wrap{flex:1;max-width:320px;}
.exam-prog-label{font-size:.7rem;color:var(--gray-500);display:flex;justify-content:space-between;margin-bottom:.2rem;}
.exam-prog-bar{height:5px;background:var(--gray-200);border-radius:3px;overflow:hidden;}
.exam-prog-fill{height:100%;background:linear-gradient(90deg,var(--secondary),var(--primary));border-radius:3px;transition:width .4s;}
.timer-badge{background:var(--exam);color:white;padding:.2rem .65rem;border-radius:999px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:.3rem;}
.timer-badge.urgent{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.65;}}
.section-divider-lbl{font-size:.7rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;padding:.35rem 0 .1rem;}
/* Results */
.results-hero{text-align:center;padding:2rem 1rem 1.5rem;background:var(--card-bg,white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gray-200);margin-bottom:1.5rem;}
.results-score{font-size:2.8rem;font-weight:900;color:var(--primary);}
.results-label{font-size:.88rem;color:var(--gray-500);margin-top:.2rem;}
.results-chips{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
.chip{padding:.3rem .85rem;border-radius:999px;font-size:.78rem;font-weight:700;}
.chip-correct{background:var(--secondary-light);color:#065f46;}
.chip-wrong{background:var(--danger-light);color:#7f1d1d;}
.chip-skip{background:var(--gray-100);color:var(--gray-600);}
/* Smart Review */
.review-subnav{display:flex;gap:.4rem;padding:.6rem 1.1rem;border-bottom:1px solid var(--gray-200);background:var(--card-bg,white);position:sticky;top:0;z-index:10;flex-shrink:0;}
.review-tab{flex:1;padding:.45rem;text-align:center;border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:.82rem;transition:.18s;}
.review-tab.both-tab{background:var(--gray-100);color:var(--gray-600);}
.review-tab.both-tab.active{background:var(--primary);color:white;}
.review-tab.incorrect-tab{background:var(--danger-light);color:var(--danger);}
.review-tab.incorrect-tab.active{background:var(--danger);color:white;}
.review-tab.bookmark-tab{background:var(--warning-light);color:#92400e;}
.review-tab.bookmark-tab.active{background:var(--warning);color:white;}
/* ═══════════════════════════════════════════
DIALOG
═══════════════════════════════════════════ */
.dlg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:flex-end;justify-content:center;}
.dlg-overlay.hidden{display:none;}
.dlg-sheet{background:var(--card-bg,white);border-radius:20px 20px 0 0;padding:1.5rem 1.25rem;width:100%;max-width:520px;padding-bottom:max(1.5rem,env(safe-area-inset-bottom));}
.dlg-title{font-weight:700;font-size:1rem;margin-bottom:.35rem;}
.dlg-msg{font-size:.87rem;color:var(--gray-600);margin-bottom:1.2rem;line-height:1.5;}
.dlg-actions{display:flex;gap:.5rem;}
.dlg-actions .btn{flex:1;justify-content:center;}
/* ═══════════════════════════════════════════
TOAST
═══════════════════════════════════════════ */
.mq-toast{
position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
background:var(--gray-800);color:white;padding:.6rem 1.4rem;
border-radius:999px;font-size:.85rem;font-weight:600;z-index:9998;
box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:1;transition:opacity .35s;pointer-events:none;
}
/* ═══════════════════════════════════════════
SCROLL FAB
═══════════════════════════════════════════ */
#scrollFab{
position:fixed;bottom:1.5rem;right:1.25rem;
width:40px;height:40px;border-radius:50%;
background:var(--primary);color:white;border:none;cursor:pointer;z-index:300;
display:flex;align-items:center;justify-content:center;font-size:.9rem;
box-shadow:0 4px 12px rgba(79,70,229,.4);opacity:.85;
transition:background .2s,transform .2s,opacity .2s;
}
#scrollFab:hover{background:var(--primary-dark);opacity:1;transform:translateY(-2px);}
/* ═══════════════════════════════════════════
UTILS
═══════════════════════════════════════════ */
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-center{display:flex;align-items:center;gap:.5rem;}
.mt-2{margin-top:.5rem;}.mt-3{margin-top:.75rem;}.mt-4{margin-top:1rem;}
.text-muted{color:var(--gray-500);font-size:.86rem;}
.text-danger{color:var(--danger);}.text-secondary{color:var(--secondary);}
[dir=rtl]{text-align:right;}
.u-divider-line{flex:1;height:2px;background:var(--gray-200);border-radius:1px;}
#mqConfettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;}
/* Section prev/next arrows */
.sec-nav-arrows{
display:flex;justify-content:space-between;align-items:center;
padding:.75rem 0 .25rem;margin-top:.5rem;
}
.sec-nav-btn{
width:38px;height:38px;border-radius:50%;
border:1.5px solid var(--gray-200);background:var(--card-bg,white);
display:flex;align-items:center;justify-content:center;
cursor:pointer;color:var(--gray-500);font-size:.9rem;
transition:all .18s;
}
.sec-nav-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.sec-nav-btn:disabled{opacity:.3;cursor:default;pointer-events:none;}
.sec-nav-spacer{flex:1;}

/* ═══════════════════════════════════════════
DARK MODE BUTTON
═══════════════════════════════════════════ */
#darkModeBtn{font-size:1.05rem;padding:.28rem .45rem;border-radius:6px;border:1px solid var(--gray-200);background:transparent;cursor:pointer;color:var(--gray-500);transition:color .2s,background .2s;display:flex;align-items:center;}
#darkModeBtn:hover{background:var(--gray-100);color:var(--gray-700);}
/* ═══════════════════════════════════════════
DARK MODE
═══════════════════════════════════════════ */
[data-theme="dark"]{
--primary:#818cf8; --primary-light:#1e1b4b; --primary-dark:#a5b4fc;
--secondary:#34d399; --secondary-light:#064e3b;
--danger:#f87171; --danger-light:#450a0a;
--warning:#fbbf24; --warning-light:#451a03;
--exam:#a78bfa; --exam-light:#2e1065;
--written:#22d3ee; --written-light:#083344;
--gray-50:#0f1117; --gray-100:#1a1d27; --gray-200:#252836;
--gray-300:#363a50; --gray-400:#6b7280; --gray-500:#9ca3af;
--gray-600:#d1d5db; --gray-700:#e5e7eb; --gray-800:#f3f4f6;

[data-theme="dark"] .match-item.matched{background:var(--secondary-light);border-color:var(--secondary);}

[data-theme="dark"] .feedback-incorrect{background:var(--danger-light);border-color:var(--danger);color:#fca5a5;}
[data-theme="dark"] .results-hero{background:var(--card-bg);border-color:var(--gray-200);}

.watermark{text-align:center;padding:.4rem .4rem .25rem;border-top:1px solid var(--gray-200);margin-top:.3rem;user-select:none;overflow:hidden;transition:padding .2s ease;}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isAr(t){ return /[\u0600-\u06FF]/.test(t); }
function aDir(t){ return isAr(t)?'dir="rtl"':''; }
const LTR = 'ABCDE';
function mqMediaType(src){
if(!src)return 'image';
if(src.startsWith('data:video/')||/.(mp4|webm|ogg|mov)$/i.test(src))return 'video';
if(src.startsWith('data:audio/')||/.(mp3|wav|aac|m4a|flac)$/i.test(src))return 'audio';
if(src.startsWith('data:image/gif')||/.gif$/i.test(src))return 'gif';
return 'image';
}
function mqRenderMedia(m){
const src=m.src||'', type=m.type||mqMediaType(src);
if(type==='video') return `<video src="${esc(src)}" controls style="max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--gray-200);margin-bottom:.5rem;display:block;"></video>`;
if(type==='audio') return `<audio src="${esc(src)}" controls style="width:100%;border-radius:8px;margin-bottom:.5rem;display:block;"></audio>`;
return `<img src="${esc(src)}" style="max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--gray-200);object-fit:cover;margin-bottom:.5rem;display:block;">`;
}
function secProg(sec){
const qs=sec.questions.filter(q=>q.type!=='divider');
const done=qs.filter(q=>S.answers[q.id]!==undefined).length;
return {done,total:qs.length,pct:qs.length?Math.round(done/qs.length*100):0};
}
function showToast(msg, type){
const old=document.getElementById('__toast');if(old)old.remove();
const t=document.createElement('div');t.id='__toast';t.className='mq-toast';
t.style.background = type==='success'?'#10b981':type==='error'?'#ef4444':'#1f2937';
t.textContent=msg; document.body.appendChild(t);
setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},2600);
}

function buildDivider(q){

:`<div style="height:2px;background:${c||'var(--gray-200)'};border-radius:1px;margin:.75rem 0;"></div>`;
}
function buildCard(q,qn,inExam,forceShowFeedback){
const ans=inExam?_examSt.answers[q.id]:S.answers[q.id];
const bkm=S.bookmarks.has(q.id);
const bc={mcq:'badge-mcq',mcq_multi:'badge-mcq-multi',tf:'badge-tf',written:'badge-written',matching:'badge-matching',ordering:'badge-ordering'}[q.type]||'';
const bl={mcq:'MCQ',mcq_multi:'MULTI',tf:'T/F',written:'Written',matching:'Match',ordering:'Order'}[q.type]||q.type;
const bkmBtn=`<button class="bookmark-btn${bkm?' active':''}" id="bkm-${q.id}" onclick="toggleBkm('${q.id}')">${bkm?'🔖':'☆'}</button>`;
const imgs=((q.images||[]).map(s=>({src:s,type:mqMediaType(s)})).concat(Array.isArray(q.media)?q.media.filter(Boolean):[])).map(m=>mqRenderMedia(m)).join('');
const showFeedback = forceShowFeedback!==undefined ? forceShowFeedback : (!inExam || (_examSt && _examSt.instant));
return `<div class="card" id="card-${q.id}" style="border-left-color:${q.color||'var(--gray-200)'};">
<div class="card-header">
<div class="flex-center"><span class="badge ${bc}">${bl}</span><span class="q-num">Q${qn}</span>${inExam?`<span class="text-muted" style="font-size:.7rem;margin-left:.25rem;">${esc(q.secTitle||'')}</span>`:''}</div>
<div class="flex-center">${bkmBtn}</div>
</div>
<div class="q-text" ${aDir(q.text)}>${esc(q.text)}</div>${imgs}${buildInner(q,ans,inExam,showFeedback)}</div>`;
}
function buildInner(q,ans,inExam,showFeedback=true){
switch(q.type){
case 'mcq':     return buildMCQ(q,ans,inExam,showFeedback);
case 'mcq_multi': return buildMulti(q,ans,inExam,showFeedback);
case 'tf':      return buildTF(q,ans,inExam,showFeedback);
case 'written': return buildWritten(q,inExam,showFeedback);
case 'matching': return buildMatching(q,ans,inExam,showFeedback);
case 'ordering': return buildOrdering(q,ans,inExam,showFeedback);
default: return '';
}

const shuffle=document.getElementById('opt-shuffle').checked;
const instant=document.querySelector('input[name=fbmode]:checked')?.value==='instant';
const timerMin=parseInt(document.getElementById('opt-timer').value)||0;
let qs=[];
selected.forEach(si=>{
const sec=QUIZ_SECTIONS[si];
sec.questions.filter(q=>q.type!=='divider').forEach(q=>{ qs.push({...q,secTitle:sec.title,globalId:q.id}); });

if(shuffle) qs=qs.sort(()=>Math.random()-.5);
_examSt={qs,answers:{},instant,_inProgress:true,written:{},scores:{},_revFilter:'all'};

qs.forEach(q=>{

async function finishExam(){
if(!_examSt)return;
clearInterval(_examTid); _examTid=null;
_examSt.qs.forEach(q=>{ if(_examSt.answers[q.id]!==undefined) S.answers[q.id]=_examSt.answers[q.id]; });
_examSt._inProgress=false;
saveState();
// Compute score once and cache on _examSt
let correct=0,total=0,skipped=0;
_examSt.qs.forEach(q=>{
if(q.type==='written'){return;}
total++;
const ua=_examSt.answers[q.id];
if(ua===undefined){skipped++;return;}
if(q.type==='mcq'&&parseInt(ua)===parseInt(q.answer)) correct++;
else if(q.type==='tf'&&(ua===true||ua==='true'||ua==='True')===(q.answer===true||q.answer==='true'||q.answer==='True')) correct++;
else if(q.type==='mcq_multi'&&JSON.stringify([...ua].sort((a,b)=>a-b))===JSON.stringify([...q.answer].sort((a,b)=>a-b))) correct++;
else if(q.type==='ordering'&&JSON.stringify(ua)===JSON.stringify(q.answer||q.items.map((_,i)=>i))) correct++;
else if(q.type==='matching'&&q.pairs.every((_,i)=>parseInt(ua[i])===i)) correct++;
});
_examSt._score={correct,total,skipped};
showScreen('results'); updateTopbar('results'); renderSidebar();
renderResults();
}

function renderReview(){
const allQs=QUIZ_SECTIONS.flatMap((s,si)=>s.questions.filter(q=>q.type!=='divider').map(q=>({...q,secTitle:s.title})));
const mids=new Set(allQs.filter(q=>{ const ua=S.answers[q.id]; if(ua===undefined)return false; if(q.type==='mcq')return parseInt(ua)!==parseInt(q.answer); if(q.type==='tf')return(ua===true||ua==='true'||ua==='True')!==(q.answer===true||q.answer==='true'||q.answer==='True'); if(q.type==='mcq_multi')return JSON.stringify([...ua].sort((a,b)=>a-b))!==JSON.stringify([...q.answer].sort((a,b)=>a-b)); return false; }).map(q=>q.id));
const bkmIds=S.bookmarks;
let items=allQs.filter(q=>{ if(_revFilter==='incorrect')return mids.has(q.id); if(_revFilter==='bookmarks')return bkmIds.has(q.id); return mids.has(q.id)||bkmIds.has(q.id); });
const count=items.length;
document.getElementById('snav-review-badge').textContent=count||'';
document.getElementById('snav-review-badge').style.display=count?'':'none';
const body=document.getElementById('rev-body');
if(!count){body.innerHTML=`<div style="text-align:center;padding:3rem 1rem;color:var(--gray-400);">✅<h3 style="color:var(--gray-600);margin-top:.5rem;">All clear!</h3><p>No mistakes or bookmarks yet.</p></div>`;return;}
let h='<div class="container">';
items.forEach(q=>{
const isMist=mids.has(q.id),isBkm=bkmIds.has(q.id);
const bc={mcq:'badge-mcq',mcq_multi:'badge-mcq-multi',tf:'badge-tf',written:'badge-written',matching:'badge-matching',ordering:'badge-ordering'}[q.type]||'';
let labelHtml='';
if(isMist) labelHtml+=`<span style="font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:var(--danger-light);color:var(--danger);">✗ Mistake</span>`;
if(isBkm) labelHtml+=`<span style="font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:var(--warning-light);color:#92400e;">🔖 Saved</span>`;
const borderColor=isMist?'var(--danger)':isBkm?'var(--warning)':'var(--gray-200)';
h+=`<div class="card" style="border-left-color:${borderColor};">
<div class="card-header">
<div class="flex-center" style="gap:.3rem;flex-wrap:wrap;">${labelHtml}<span class="badge ${bc}">${q.type.toUpperCase()}</span></div>
<button class="bookmark-btn${isBkm?' active':''}" onclick="toggleBkm('${q.id}')">${isBkm?'🔖':'☆'}</button>
</div>
<div class="q-text" ${aDir(q.text)}>${esc(q.text)}</div>
<div class="text-muted" style="margin-bottom:.55rem;font-size:.75rem;">📁 ${esc(q.secTitle)}</div>
${buildInner(q,S.answers[q.id],false)}
</div>`;
});
h+='</div>'; body.innerHTML=h;
}

/* ════════════════════════════════════════════
DRAG (ordering)
════════════════════════════════════════════ */
(function(){
const T=5,SZ=60,SS=10;
let _s=null,_g=null,_oEl=null,_oP=null,_act=false,_raf=null,_cx=0,_cy=0;
function _mk(el){const r=el.getBoundingClientRect(),g=el.cloneNode(true);g.className='dm-ghost';g.removeAttribute('data-dm-role');g.style.cssText=`width:${r.width}px;height:${r.height}px;left:${r.left}px;top:${r.top}px;`;document.body.appendChild(g);return g;}
function _cO(){if(_oEl){_oEl.classList.remove('dm-drop-before','dm-drop-after');_oEl=null;_oP=null;}}
function _sO(el,p){if(el===_oEl&&p===_oP)return;_cO();if(el){_oEl=el;_oP=p;el.classList.add(p==='before'?'dm-drop-before':'dm-drop-after');}}
function _can(){cancelAnimationFrame(_raf);_raf=null;if(_g){_g.remove();_g=null;}_cO();if(_s){_s.el.classList.remove('dm-dragging');_s=null;}_act=false;}
function _sc(){_raf=null;const el=document.querySelector('.screen.active .content-area');if(el){const r=el.getBoundingClientRect();if(_cy<r.top+SZ)el.scrollTop-=SS;else if(_cy>r.bottom-SZ)el.scrollTop+=SS;}if(_act)_raf=requestAnimationFrame(_sc);}
function _fn(x,y){if(_g)_g.style.visibility='hidden';const h=document.elementFromPoint(x,y);if(_g)_g.style.visibility='';if(!h||!_s)return{el:null,p:null};const t=h.closest('[data-dm-role="ordering-item"]');if(!t||t===_s.el||t.dataset.dmList!==_s.el.dataset.dmList)return{el:null,p:null};const r=t.getBoundingClientRect();return{el:t,p:y<r.top+r.height/2?'before':'after'};}
function _cm(src,dst,pos){
const listId=src.dataset.dmList,fp=parseInt(src.dataset.dmPos),dp=parseInt(dst.dataset.dmPos);
let ins=pos==='before'?dp:dp+1;if(fp===ins||fp+1===ins)return;
const qId=listId.replace('ol-','');
const q=QUIZ_SECTIONS.flatMap(s=>s.questions).find(q=>q.id===qId);if(!q)return;
const pk='op_'+qId,arr=[...(_mp[pk]||q.items.map((_,i)=>i))];
const[m]=arr.splice(fp,1);arr.splice(fp<ins?ins-1:ins,0,m);_mp[pk]=arr;
reRender();
}
document.addEventListener('pointerdown',e=>{if(e.button&&e.pointerType==='mouse')return;const h=e.target.closest('.ordering-handle');if(!h)return;const el=h.closest('[data-dm-role="ordering-item"]');if(!el)return;_s={el,startX:e.clientX,startY:e.clientY};_act=false;},{passive:true});
document.addEventListener('pointermove',e=>{if(!_s)return;const dx=e.clientX-_s.startX,dy=e.clientY-_s.startY;_cx=e.clientX;_cy=e.clientY;if(!_act){if(Math.hypot(dx,dy)<T)return;_act=true;_g=_mk(_s.el);_s.el.classList.add('dm-dragging');if(!_raf)_raf=requestAnimationFrame(_sc);}_g.style.transform=`translate(${dx}px,${dy}px)`;const{el,p}=_fn(e.clientX,e.clientY);_sO(el,p);},{passive:true});
function _end(){if(!_s)return;const s=_s.el,d=_oEl,p=_oP;_can();if(d&&p)_cm(s,d,p);}
document.addEventListener('pointerup',_end,{passive:true});
document.addEventListener('pointercancel',_can,{passive:true});
})();
/* ════════════════════════════════════════════
CONFETTI
════════════════════════════════════════════ */
function confetti(){
const COLORS=['#4f46e5','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
let running=false; if(running)return; running=true;
const c=document.createElement('canvas');
c.id='mqConfettiCanvas'; document.body.appendChild(c);
const ctx=c.getContext('2d'); c.width=window.innerWidth; c.height=window.innerHeight;
const P=Array.from({length:100},()=>({x:Math.random()*c.width,y:-10-Math.random()*40,r:4+Math.random()*6,d:1.5+Math.random()*2.5,color:COLORS[Math.floor(Math.random()*COLORS.length)],tilt:Math.random()*10-5,tiltSpeed:.1+Math.random()*.2,angle:0,spin:(Math.random()-.5)*.15,shape:Math.random()<.5?'rect':'circle'}));
let f=0; const MAX=130;
function draw(){
if(f>MAX){c.remove();running=false;return;}
ctx.clearRect(0,0,c.width,c.height);
P.forEach(p=>{p.angle+=p.spin;p.tilt+=Math.sin(f*p.tiltSpeed)*.4;p.y+=p.d+Math.sin(f*.05)*.3;p.x+=Math.sin(p.angle)*1.2;ctx.save();ctx.globalAlpha=Math.max(0,1-f/MAX);ctx.fillStyle=p.color;ctx.translate(p.x,p.y);ctx.rotate(p.tilt*Math.PI/180);if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}else{ctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);}ctx.restore();});
f++;requestAnimationFrame(draw);
}
draw();
}
/* ════════════════════════════════════════════
WRITTEN COMPARISON
════════════════════════════════════════════ */
function highlightDifferences(userText,modelText){
if(!modelText) return esc(userText);
// hex escapes survive all quoting/escaping contexts
const uW=userText.split(/[\x09\x0a\x0d ]+/).filter(Boolean);
const mW=modelText.split(/[\x09\x0a\x0d ]+/).filter(Boolean);
// Simple LCS-based diff so words aren't eaten by the naive zipper
const dp=Array.from({length:uW.length+1},()=>new Array(mW.length+1).fill(0));
for(let a=1;a<=uW.length;a++) for(let b=1;b<=mW.length;b++)
dp[a][b]=uW[a-1].toLowerCase()===mW[b-1].toLowerCase()?dp[a-1][b-1]+1:Math.max(dp[a-1][b],dp[a][b-1]);
const res=[];let a=uW.length,b=mW.length;
const extra=[],missing=[];
while(a>0||b>0){
if(a>0&&b>0&&uW[a-1].toLowerCase()===mW[b-1].toLowerCase()){res.unshift({t:'eq',w:uW[a-1]});a--;b--;}
else if(b>0&&(a===0||dp[a][b-1]>=dp[a-1][b])){res.unshift({t:'mis',w:mW[b-1]});b--;}
else{res.unshift({t:'ext',w:uW[a-1]});a--;}
}
return res.map(r=>
r.t==='eq'  ? esc(r.w) :
r.t==='ext' ? `<span style="background:#fecaca;border-radius:3px;padding:0 2px;">${esc(r.w)}</span>` :
`<span style="background:#bbf7d0;border-radius:3px;padding:0 2px;">${esc(r.w)}</span>`
).join(' ');
}

function toggleDarkMode(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');localStorage.setItem('mq_theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('mq_theme','dark');}
  _updateDarkBtn(!isDark);
}
function _updateDarkBtn(isDark){
  const btn=document.getElementById('darkModeBtn');
  if(!btn)return;
  btn.innerHTML=isDark
    ?'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-15v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    :'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
  btn.title=isDark?'Switch to light mode':'Switch to dark mode';
}
(function initDarkMode(){
  const saved=localStorage.getItem('mq_theme');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(saved==='dark'||(saved===null&&prefersDark)){
    document.documentElement.setAttribute('data-theme','dark');
    _updateDarkBtn(true);
  }
})();
